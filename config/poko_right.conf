# poko 右手 = セントラル（PC と BLE 接続する親）＋ トラックボール

# --- ブリングアップ用ログ（設計書 §13）---
# ここには書かない。build.yaml の `snippet: zmk-usb-logging` 付きエントリで付ける。
# CONFIG_ZMK_USB_LOGGING=y 単独では CDC-ACM デバイスも chosen zephyr,console も
# 生えず、ログの出力先が無いので何も見えない。

# USB 再列挙でブート直後のログが落ちるのを防ぐ（実装ノート §16-5）。
# ログ無効時は何もしないので常用ファームには影響しない。
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2000

# --- ポインティング / PMW3610 ---
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
# ドライバは cormoran/zmk-driver-pmw3610-with-custom-studio-rpc。
#    west.yml / poko_right.overlay の compatible と3点セットで揃える。
CONFIG_PMW3610=y
# RMK 版の report_hz = 75 に揃える（1000 / 75 ≒ 13ms）
CONFIG_PMW3610_REPORT_INTERVAL_MIN=13
# 試作基板で左右反転を確認済み。旧ドライバの DT `invert-x` 相当
CONFIG_PMW3610_INVERT_X=y

# --- 省電力（設計書 §5・実装ノート §9）---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- 電池 ---
# 本番基板は部品配置の都合で電池電圧の監視回路を載せていないので無効。
# ボード標準の vbatt（XIAO 内蔵分圧）も poko.dtsi で disabled にしてある。
CONFIG_ZMK_BATTERY_REPORTING=n

# ZMK Studio対応
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- DYA Studio（Custom Studio Protocol, レベル2）---
# https://studio.dya.cormoran.works/developer-guide/level-2
# 右＝セントラルだけに入れる。左はトラボも Studio も無いので何もしない。

# コアモジュール
# https://github.com/cormoran/zmk-feature-custom-settings
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# https://github.com/cormoran/zmk-feature-fast-keymap
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# Trackball タブ
# https://github.com/cormoran/zmk-driver-pmw3610-with-custom-studio-rpc
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
# https://github.com/cormoran/zmk-module-runtime-input-processor
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# スタックとバッファ（ガイドの推奨値そのまま）。
# 足りないと Studio からの一覧取得などで MPU スタックガードに引っかかって落ちる。
# ガイドにある SPLIT_RELAY_EVENT / *_SPLIT_RPC_RELAY 系は、左手の設定を
# Studio から触るためのものなので入れていない（左に対象が無い）。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# --- トラボのブリングアップ用（必要なときだけ有効化）---
# ドライバのログを出す。build.yaml の poko_right-logging と併用すること。
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# `Incorrect ... id 0xFF (expecting 0x3E)` が出るなら、センサーの電源が立ち上がる
# 前に init している。ドライバ README のとおり遅延を入れる。
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
